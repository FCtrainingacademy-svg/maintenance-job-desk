services:
  - type: web
    name: maintenance-job-desk
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maintenance-job-desk-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OFFICE_PASSWORD
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: DIARY_SYNC_URL
        value: https://ksplumbingstore.co.uk/api/bot/diary-sync
      - key: DIARY_SYNC_KEY
        sync: false

databases:
  - name: maintenance-job-desk-db
    plan: basic-256mb
    region: frankfurt
