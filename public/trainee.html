<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FC Training – my jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>
.wrap{max-width:720px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;margin-bottom:12px}
.card h3{font-size:19px}
.prog{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:13px}
.prog>div{background:var(--surface);padding:6px 8px;text-align:center}.prog>div.h{font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase}
.ck{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}.ck input{margin-top:3px;width:20px;height:20px;flex:none}
.muted{color:var(--muted)}
.st{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 8px;border-radius:999px;background:var(--grey-soft);justify-self:start}
</style>
</head><body>
<div class="wrap">
  <header class="bar"><div class="brand"><h1>FC Training jobs</h1><span id="sub"></span></div><nav class="tabs" id="tabs"></nav></header>
  <main id="main"><div class="empty">Loading your jobs…</div></main>
</div>
<div id="toast" class="toast" hidden></div>
<script>
(function(){
"use strict";
const TOKEN=location.pathname.split("/").filter(Boolean)[1]||"";
const API="/api/t/"+encodeURIComponent(TOKEN);
const S={d:null,tab:"open",open:null,error:null};
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDT=iso=>{if(!iso)return"Time to be arranged";const d=new Date(iso);return isNaN(d)?esc(iso):d.toLocaleString("en-GB",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})};
const STL={accepted:"Waiting for supervisor",confirmed:"Confirmed",done:"Done – waiting for sign-off",signedoff:"Signed off"};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3000)}
async function api(method,path,body){
  const r=await fetch(API+path,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Something went wrong – try again");return j;
}
async function load(){try{S.d=await api("GET","");S.error=null;if(S.d.role==="supervisor")S.tab="mine"}catch(e){S.error=e.message}render()}
setInterval(()=>{if(!document.hidden&&!S.open)load()},30000);

function render(){
  if(S.error){$("#main").innerHTML=`<div class="empty">${esc(S.error)}</div>`;return}
  const d=S.d,sup=d.role==="supervisor";
  $("#sub").textContent=d.me.name+(sup?" · supervisor":d.me.cohort?" · cohort "+d.me.cohort:"");
  const tabs=sup?[["mine","Jobs I supervise"]]:[["open",`Available (${d.open.length})`],["mine",`My jobs (${d.mine.filter(j=>j.status!=="signedoff").length})`],["progress","My portfolio"]];
  $("#tabs").innerHTML=tabs.map(([k,l])=>`<button class="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("");
  $("#main").innerHTML=S.tab==="open"?vOpen():S.tab==="progress"?vProgress():vMine();
}
function vOpen(){
  const d=S.d;
  if(!d.open.length)return `<div class="card"><div class="empty">No training jobs open right now. You'll get a WhatsApp from FC Training Academy when one comes in.</div></div>`;
  return `<p class="muted">The first learner to accept is put forward. The office then confirms your supervising engineer and sends you the address.</p>`+d.open.map(j=>`<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(j.kind)}</h3><span class="mono">${esc(j.ref)}</span></div>
  <div>📅 ${fmtDT(j.date)} · 📍 ${esc(j.area)} area</div>${j.description?`<div>${esc(j.description)}</div>`:""}
  <div><button class="btn go big" data-accept="${j.id}">Accept job</button></div></div>`).join("");
}
function vMine(){
  const d=S.d,sup=d.role==="supervisor",js=d.mine;
  if(!js.length)return `<div class="card"><div class="empty">${sup?"No jobs to supervise yet.":"You haven't got any training jobs yet. Accept one from Available."}</div></div>`;
  return js.map(j=>{
    const ck=j.checklist||{},canDone=!sup&&j.status==="confirmed",open=S.open===j.id;
    return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(j.kind)}</h3><span class="mono">${esc(j.ref)}</span></div><span class="st">${esc(STL[j.status]||j.status)}</span>
    <div>📅 ${fmtDT(j.date)}</div>${j.status==="accepted"?`<div>📍 ${esc(j.area)} area – you'll get the full address once your supervisor is confirmed.</div>`:`<div>📍 ${esc(j.address)} <a href="https://maps.google.com/?q=${encodeURIComponent(j.address)}" target="_blank" rel="noopener">Map</a></div>`}
    ${j.description?`<div>🔧 ${esc(j.description)}</div>`:""}${j.status!=="accepted"&&j.access?`<div>ℹ️ ${esc(j.access)}</div>`:""}
    ${j.status!=="accepted"&&j.customer&&j.customer.name?`<div>Customer: ${esc(j.customer.name)} ${j.customer.phone?`<a href="tel:${esc(j.customer.phone)}">${esc(j.customer.phone)}</a>`:""}</div>`:""}
    ${!sup&&j.supervisor?`<div>Supervisor: <b>${esc(j.supervisor.name)}</b> ${j.supervisor.phone?`<a href="tel:${esc(j.supervisor.phone)}">${esc(j.supervisor.phone)}</a>`:""}${j.supervisor.gasSafe?` · Gas Safe ${esc(j.supervisor.gasSafe)}`:""}</div>`:""}
    ${sup&&j.learner?`<div>Learner: <b>${esc(j.learner.name)}</b> ${j.learner.phone?`<a href="tel:${esc(j.learner.phone)}">${esc(j.learner.phone)}</a>`:""}</div>`:""}
    ${["done","signedoff"].includes(j.status)?`<div><b>What was done:</b><div style="white-space:pre-wrap">${esc(j.findings)}</div></div><details><summary style="cursor:pointer;font-weight:600">Checklist (${j.checklistItems.filter(i=>ck[i]).length}/${j.checklistItems.length})</summary>${j.checklistItems.map(i=>`<div class="ck">${ck[i]?"✅":"⬜"} ${esc(i)}</div>`).join("")}</details>`:""}
    ${j.status==="signedoff"?`<div class="muted">Signed off by ${esc(j.signedOffBy)}</div>`:""}
    ${sup&&j.status==="done"?`<div><button class="btn go big" data-signoff="${j.id}">Sign off this job</button></div>`:""}
    ${canDone?(open?`<form data-done="${j.id}"><h3 style="font-size:16px;margin:6px 0">Portfolio checklist</h3>${j.checklistItems.map((i,n)=>`<label class="ck"><input type="checkbox" name="c${n}"><span>${esc(i)}</span></label>`).join("")}
      <label style="display:grid;gap:4px;margin-top:10px;font-weight:600">What did you do on this job?<textarea name="findings" rows="4" required placeholder="e.g. Serviced Vaillant ecoTEC plus 832. Tightness test passed, working pressure 20 mbar, FGA CO/CO2 ratio 0.0012…"></textarea></label>
      <div class="row" style="margin-top:10px"><button class="btn go big">Mark job done</button><button type="button" class="btn" data-close="1">Not yet</button></div></form>`
      :`<div><button class="btn primary big" data-openform="${j.id}">I've finished – fill in checklist</button></div>`):""}
    </div>`}).join("");
}
function vProgress(){
  const p=S.d.progress,L=S.d.labels,types=Object.keys(L.types);
  return `<div class="card"><h3>Onsite portfolio: ${p.total} of ${p.target} jobs</h3><div class="meter" style="height:8px;background:var(--sunk);border-radius:999px;overflow:hidden"><i style="display:block;height:100%;width:${Math.min(100,Math.round(p.total/p.target*100))}%;background:var(--ok)"></i></div>
  <div class="prog"><div class="h"></div>${types.map(t=>`<div class="h">${esc(L.types[t])}</div>`).join("")}
  ${Object.keys(L.appliances).map(a=>`<div style="font-weight:700;text-align:left">${esc(L.appliances[a])}</div>${types.map(t=>{const c=p.grid[a][t];return `<div class="mono" style="color:${c.done>=c.target?"var(--ok)":c.done?"var(--urgent)":"inherit"}">${c.done}/${c.target}</div>`}).join("")}`).join("")}</div>
  <p class="muted" style="margin:0;font-size:13px">Counts training jobs you've marked done here. Your assessor still checks the evidence in Ecordia.</p></div>`;
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab],[data-accept],[data-openform],[data-close],[data-signoff]");if(!t)return;
  try{
    if(t.dataset.tab){S.tab=t.dataset.tab;S.open=null;render();return}
    if(t.dataset.openform){S.open=t.dataset.openform;render();return}
    if(t.dataset.close){S.open=null;render();return}
    t.disabled=true;
    if(t.dataset.accept){await api("POST",`/jobs/${t.dataset.accept}/accept`);toast("You're put forward – the office will confirm your supervisor");S.tab="mine"}
    if(t.dataset.signoff){if(!confirm("Sign off this job? It goes on the learner's portfolio record.")){t.disabled=false;return}await api("POST",`/jobs/${t.dataset.signoff}/signoff`);toast("Signed off")}
    await load();
  }catch(err){toast(err.message);await load()}
});
document.addEventListener("submit",async e=>{
  const f=e.target;if(!f.dataset.done)return;e.preventDefault();
  const j=S.d.mine.find(x=>x.id===f.dataset.done),checklist={};
  j.checklistItems.forEach((i,n)=>{checklist[i]=!!f.elements["c"+n].checked});
  try{await api("POST",`/jobs/${j.id}/done`,{checklist,findings:f.elements.findings.value});S.open=null;toast("Marked done – your supervisor will sign it off");await load()}catch(err){toast(err.message)}
});
load();
})();
</script>
</body></html>
