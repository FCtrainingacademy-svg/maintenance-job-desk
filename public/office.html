<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maintenance Job Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head><body>

<div class="wrap">
  <header class="bar">
    <div class="brand"><h1>Maintenance Job Desk</h1><span id="sub">Day-to-day &amp; out-of-hours property repairs</span></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <div id="banner"></div>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
const linkFor=k=>k&&k.token?`${S.baseUrl||location.origin}/c/${k.token}`:"";
const newToken=()=>{const b=new Uint8Array(18);crypto.getRandomValues(b);return btoa(String.fromCharCode(...b)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const STATUSES=[["new","New"],["scheduled","Booked"],["in_progress","On site"],["awaiting_parts","Awaiting parts"],["complete","Complete"],["invoiced","Invoiced"],["paid","Paid"],["cancelled","Cancelled"]];
const SLABEL=Object.fromEntries(STATUSES);
const PRIORITIES=[["emergency","Emergency (out of hours)",4],["urgent","Urgent – 24 hours",24],["routine","Routine – 7 days",168],["planned","Planned / quote",336]];
const PLABEL=Object.fromEntries(PRIORITIES.map(p=>[p[0],p[1]]));
const CATEGORIES=["Plumbing / leak","Heating / boiler","Gas safety (CP12)","Electrical","Drainage / blockage","Roofing / gutters","Carpentry / doors / locks","Damp & mould","Decorating","Appliance","General repair","Other"];
const ACCESS=["Tenant to let in","Key safe","Collect keys from agent","Keys held by us","Landlord to meet","Concierge / caretaker","Other"];
const ROLES=["Letting agent","Landlord","Managing agent","Tenant","Housing association","Council","Other"];
const OPEN=["new","scheduled","in_progress","awaiting_parts"];
const TRACK=[["posted","Posted"],["accepted","Accepted"],["booked","Booked in"],["enroute","On the way"],["onsite","On site"],["parts","Awaiting parts"],["done","Work complete"],["signedoff","Signed off"]];
const TLABEL=Object.fromEntries(TRACK);
const T2STATUS={accepted:"scheduled",booked:"scheduled",enroute:"scheduled",onsite:"in_progress",parts:"awaiting_parts",done:"complete"};
const SERVER_D=["status","allocatedTo","allocatedAt","acceptedVia","agreedPrice","contractorAttendBy","contractorFinishBy","postedAt","recipients"];
const CONTRACTOR_KEYS=["status","scheduledAt","findings","completedAt"];
const KPS={name:"K's Plumbing Store",web:"https://ksplumbingstore.co.uk",wa:"07488 287396"};
const DEF_SET={bizName:"",bizAddress:"",bizPhone:"",bizEmail:"",bankName:"",sortCode:"",accountNo:"",payDays:14,vatRegistered:false,vatRate:20,labourRate:55,calloutDay:75,calloutOOH:140,markup:15,footer:"Thank you for your business."};

const S={jobs:{},contacts:{},contractors:{},settings:{...DEF_SET},tab:"jobs",sel:null,draft:null,dirty:false,touched:new Set(),filter:"open",q:"",db:null,dbChecked:false,canWrite:true,
  loaded:{jobs:false},confirmDel:false,copyText:null,cDraft:null,kDraft:null,wa:{enabled:false},outbox:[],baseUrl:"",offline:false};
try{const t=localStorage.getItem("jd-tab");if(t)S.tab=t;}catch(e){}

const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const gbp=v=>"£"+n(v).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=(x,l=4)=>String(x).padStart(l,"0");
const nowISO=()=>new Date().toISOString();
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const addHours=(iso,h)=>{if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";d.setHours(d.getHours()+h);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const addDays=(dateStr,days)=>{const d=dateStr?new Date(dateStr):new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)};
const fmtDT=iso=>{if(!iso)return"—";const d=new Date(iso);if(isNaN(d))return esc(iso);return d.toLocaleString("en-GB",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})};
const fmtD=iso=>{if(!iso)return"—";const d=new Date(iso);if(isNaN(d))return esc(iso);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})};
const getPath=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const setPath=(o,p,v)=>{const ks=p.split(".");let a=o;for(let i=0;i<ks.length-1;i++){const k=ks[i];if(a[k]==null)a[k]=/^\d+$/.test(ks[i+1])?[]:{};a=a[k]}a[ks[ks.length-1]]=v};
const area=pc=>{pc=String(pc||"").trim().toUpperCase();if(!pc)return"";const p=pc.split(/\s+/);return p.length>1?p[0]:pc.slice(0,Math.max(2,pc.length-3))};
const intl=ph=>{let d=String(ph||"").replace(/[^\d+]/g,"");if(d.startsWith("+"))d=d.slice(1);else if(d.startsWith("00"))d=d.slice(2);else if(d.startsWith("0"))d="44"+d.slice(1);return d};
const waLink=(ph,text)=>`https://wa.me/${intl(ph)}?text=${encodeURIComponent(text)}`;

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function copy(text,label){
  const done=()=>toast((label||"Text")+" copied");
  const fail=()=>{S.copyText={text,label};render();};
  try{navigator.clipboard.writeText(text).then(done,fail)}catch(e){fail()}
}

/* ---------- money ---------- */
function calc(j){
  const st=S.settings;const mk=j.markup!=null&&j.markup!==""?n(j.markup):n(st.markup);
  const mats=(j.materials||[]).filter(m=>m.chargeable!==false);
  const matCost=mats.reduce((a,m)=>a+n(m.qty)*n(m.unit),0);
  const matCharge=matCost*(1+mk/100);
  const labour=(j.labour||[]).reduce((a,l)=>a+n(l.hours)*n(l.rate),0);
  const callout=n(j.callout);
  const net=matCharge+labour+callout;
  const vat=st.vatRegistered?net*n(st.vatRate)/100:0;
  const sub=j.dispatch&&j.dispatch.allocatedTo?n(j.dispatch.agreedPrice):0;
  return {mk,matCost,matCharge,labour,callout,net,vat,total:net+vat,sub,margin:net-sub-matCost};
}
function invLines(j){
  const c=calc(j);const L=[];
  if(c.callout)L.push({d:(j.priority==="emergency"?"Out-of-hours emergency call-out":"Call-out / attendance"),q:1,u:c.callout});
  (j.labour||[]).forEach(l=>{if(n(l.hours)*n(l.rate))L.push({d:"Labour – "+(l.desc||"works"),q:n(l.hours),u:n(l.rate),unit:"hr"})});
  (j.materials||[]).forEach(m=>{if(m.chargeable!==false&&n(m.qty)*n(m.unit))L.push({d:m.item||"Materials",q:n(m.qty),u:n(m.unit)*(1+c.mk/100)})});
  return L;
}

/* ---------- derived ---------- */
const jobsArr=()=>Object.values(S.jobs).sort((a,b)=>(b.reportedAt||"").localeCompare(a.reportedAt||""));
const isLate=j=>OPEN.includes(j.status)&&j.attendBy&&new Date(j.attendBy)<new Date();
const isOverdueInv=j=>j.status==="invoiced"&&j.invoice&&j.invoice.dueAt&&new Date(j.invoice.dueAt)<new Date(new Date().toDateString());
function nextRef(prefix,getter){let max=0;Object.values(S.jobs).forEach(j=>{const r=getter(j);const m=r&&String(r).match(/(\d+)$/);if(m)max=Math.max(max,+m[1])});return prefix+pad(max+1)}
function billTo(j){return j.billSame!==false?(j.issuer||{}):(j.bill||{})}
const D=j=>j.dispatch||{};
const kName=id=>{const k=S.contractors[id];return k?(k.name+(k.company?" ("+k.company+")":"")):"—"};
const activeK=()=>Object.values(S.contractors).filter(k=>k.active!==false).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
const coversTrade=(k,cat)=>!cat||!(k.trades||[]).length||(k.trades||[]).includes(cat);
function recipientsFor(j){const d=D(j);return d.sendTo==="pick"?(d.picked||[]).filter(id=>S.contractors[id]):activeK().filter(k=>coversTrade(k,j.category)).map(k=>k.id)}
function nextStep(j){const t=j.track||{};for(const [k] of TRACK){if(k==="posted"||k==="parts")continue;if(!t[k])return k}return null}
function mergeServer(d,c){
  d.quotes=Object.assign({},d.quotes,c.quotes);
  d.track=Object.assign({},d.track,c.track);
  d.cnotes=Object.assign({},d.cnotes,c.cnotes);
  if(c.alertLog)d.alertLog=c.alertLog;
  if(c.dispatch){d.dispatch=Object.assign({},d.dispatch||{});SERVER_D.forEach(k=>{if(k in c.dispatch)d.dispatch[k]=c.dispatch[k]})}
  CONTRACTOR_KEYS.forEach(k=>{if(!S.touched.has(k)&&k in c)d[k]=c[k]});
  return d;
}
function timeline(j){
  const L=(j.log||[]).map(e=>({at:e.at,who:"Office",text:e.text}));
  Object.values(j.cnotes||{}).forEach(e=>L.push({at:e.at,who:kName(e.by).split(" (")[0],text:e.text}));
  return L.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}

/* ---------- render ---------- */
function renderTabs(){
  const tabs=[["jobs","Jobs"],["contractors","Contractors"],["contacts","Contacts"],["invoices","Invoices"],["payments","Contractor payments"],["settings","Settings"]];
  $("#tabs").innerHTML=tabs.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("")
    +`<form method="post" action="/logout" style="display:inline"><button class="tab" type="submit">Log out</button></form>`;
}
function render(){
  renderTabs();
  let b="";
  if(S.noDb)b+=`<div class="banner">The database isn't connected yet, so anything you enter will be lost when the server restarts. Add DATABASE_URL in Render before using it for real jobs.</div>`;
  if(S.offline)b+=`<div class="banner">Can't reach the server. Changes will fail until the connection is back – check your internet and reload.</div>`;
  if(S.copyText)b+=`<div class="banner copybox"><div class="row"><strong>Copy this ${esc(S.copyText.label||"text")}</strong><button class="btn small" data-act="close-copy" style="margin-left:auto">Close</button></div><textarea id="copyarea" readonly>${esc(S.copyText.text)}</textarea></div>`;
  $("#banner").innerHTML=b;
  if(S.copyText){const ta=$("#copyarea");if(ta){ta.focus();ta.select()}}
  const m=$("#main");
  if(!S.loaded.jobs){m.innerHTML='<div class="empty">Loading…</div>';return}
  if(S.tab==="jobs")m.innerHTML=viewJobs();
  else if(S.tab==="contractors")m.innerHTML=viewContractors();
  else if(S.tab==="contacts")m.innerHTML=viewContacts();
  else if(S.tab==="invoices")m.innerHTML=viewInvoices();
  else if(S.tab==="payments")m.innerHTML=viewPayments();
  else m.innerHTML=viewSettings();
}

function viewStrip(){
  const all=jobsArr();
  const open=all.filter(j=>OPEN.includes(j.status));
  const em=open.filter(j=>j.priority==="emergency");
  const late=open.filter(isLate);
  const waiting=all.filter(j=>D(j).status==="open");
  const toInv=all.filter(j=>j.status==="complete");
  const owed=all.filter(j=>j.status==="invoiced").reduce((a,j)=>a+calc(j).total,0);
  return `<div class="strip">
   <button class="stat" data-filter="open"><small>Open jobs</small><b>${open.length}</b></button>
   <button class="stat ${em.length?"alert":""}" data-filter="emergency"><small>Emergencies</small><b>${em.length}</b></button>
   <button class="stat ${waiting.length?"alert":""}" data-filter="posted"><small>Awaiting contractor</small><b>${waiting.length}</b></button>
   <button class="stat ${late.length?"alert":""}" data-filter="late"><small>Past attend-by</small><b>${late.length}</b></button>
   <button class="stat" data-filter="complete"><small>Ready to invoice</small><b>${toInv.length}</b></button>
   <button class="stat" data-filter="invoiced"><small>Unpaid</small><b>${gbp(owed)}</b></button>
  </div>`;
}
function filtered(){
  const q=S.q.trim().toLowerCase();
  return jobsArr().filter(j=>{
    const f=S.filter;
    if(f==="open"&&!OPEN.includes(j.status))return false;
    if(f==="emergency"&&!(OPEN.includes(j.status)&&j.priority==="emergency"))return false;
    if(f==="late"&&!isLate(j))return false;
    if(f==="posted"&&D(j).status!=="open")return false;
    if(["complete","invoiced","paid","cancelled"].includes(f)&&j.status!==f)return false;
    if(!q)return true;
    const hay=[j.ref,j.property&&j.property.address,j.property&&j.property.postcode,j.description,j.category,j.issuer&&j.issuer.name,j.issuer&&j.issuer.company,(j.residents||[]).map(r=>r.name).join(" "),j.invoice&&j.invoice.number,D(j).allocatedTo&&kName(D(j).allocatedTo)].join(" ").toLowerCase();
    return hay.includes(q);
  });
}
function dispatchTag(j){
  const d=D(j);
  if(d.status==="open"){const qn=Object.keys(j.quotes||{}).length;return `<span class="pill d-open">${d.mode==="quote"?(qn?qn+" quote"+(qn>1?"s":""):"Quotes wanted"):"Posted"}</span>`}
  if(d.allocatedTo)return `<span>👷 ${esc(kName(d.allocatedTo).split(" (")[0])}</span>`;
  return "";
}
function viewJobs(){
  const list=filtered();
  const fl=[["open","Open"],["emergency","Emergency"],["posted","Awaiting contractor"],["late","Late"],["complete","To invoice"],["invoiced","Invoiced"],["paid","Paid"],["all","All"]];
  const items=list.map(j=>{
    const late=isLate(j);
    return `<li class="jobitem p-${esc(j.priority)}" data-job="${esc(j.id)}" aria-current="${S.sel===j.id}" tabindex="0">
      <div class="stripe"></div><div class="in">
      <div class="t"><span class="mono">${esc(j.ref)}${j.example?' <span class="example">example</span>':""}</span><span>${late?'<span class="pill late">Late</span> ':""}<span class="pill s-${esc(j.status)}">${esc(SLABEL[j.status]||j.status)}</span></span></div>
      <div class="a">${esc((j.property&&j.property.address)||"No address yet")}${j.property&&j.property.postcode?", "+esc(j.property.postcode):""}</div>
      <div class="d">${esc(j.category||"")}${j.category&&j.description?" · ":""}${esc(j.description||"")}</div>
      <div class="t"><span>${dispatchTag(j)||esc((j.issuer&&(j.issuer.company||j.issuer.name))||"")}</span><span>${j.scheduledAt?"Booked "+fmtDT(j.scheduledAt):"Attend by "+fmtDT(j.attendBy)}</span></div>
      </div></li>`}).join("");
  const loading=!S.loaded.jobs&&S.db;
  return viewStrip()+`<div class="split ${S.sel&&S.draft?"has-sel":""}">
   <aside class="rail">
    <div class="rail-head">
      <div class="row"><button class="btn primary" data-act="new-job" ${S.canWrite&&S.db?"":"disabled"}>+ New job</button><span class="hint" style="margin-left:auto">${list.length} shown</span></div>
      <input class="search" id="q" type="search" placeholder="Search address, tenant, agent, contractor…" value="${esc(S.q)}">
      <div class="chips">${fl.map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("")}</div>
    </div>
    <ul class="joblist">${loading?'<li class="empty">Loading jobs…</li>':items||`<li class="empty">${Object.keys(S.jobs).length?"No jobs match this filter.":"No jobs logged yet.<br>Press <b>+ New job</b> when the next call comes in."}</li>`}</ul>
   </aside>
   <section class="sheetcol">${S.sel&&S.draft?viewSheet():`<div class="sheet"><div class="empty">Select a job to open its job sheet, or start a new one.</div></div>`}</section>
  </div>`;
}

function opts(arr,val,blank){return (blank?`<option value="">${esc(blank)}</option>`:"")+arr.map(a=>{const[v,l]=Array.isArray(a)?a:[a,a];return `<option value="${esc(v)}" ${String(val)===String(v)?"selected":""}>${esc(l)}</option>`}).join("")}
function fld(path,label,type,extra){
  const v=getPath(S.draft,path);type=type||"text";
  if(type==="textarea")return `<label class="f"><span>${label}</span><textarea data-path="${path}" ${extra||""}>${esc(v)}</textarea></label>`;
  return `<label class="f"><span>${label}</span><input type="${type}" data-path="${path}" value="${esc(v)}" ${extra||""}></label>`;
}
function sel(path,label,arr,blank){return `<label class="f"><span>${label}</span><select data-path="${path}">${opts(arr,getPath(S.draft,path),blank)}</select></label>`}

function stepsHTML(j){
  const t=j.track||{},nx=nextStep(j);
  return `<ol class="steps">${TRACK.filter(([k])=>k!=="parts"||t.parts).map(([k,l])=>`<li class="${t[k]?"done":(k===nx?"next":"")}"><b>${l}</b><small>${t[k]?fmtDT(t[k]):(k===nx?"next":"")}</small></li>`).join("")}</ol>`;
}
function broadcastText(j){
  const d=D(j),p=j.property||{};
  return [`🔧 NEW JOB ${j.ref} – ${PLABEL[j.priority]||""}`,`${j.category||"Maintenance"} · ${area(p.postcode)||"London"} area`,j.description||"",
    `Attend by: ${fmtDT(j.attendBy)}`,
    d.mode==="quote"?`💷 Send your price and when you can attend${d.respondBy?" by "+fmtDT(d.respondBy):""}`:`💷 Fixed fee: ${gbp(d.fee)}`,
    "",d.mode==="quote"?`Send your quote on your personal job link.`:`First to accept gets the job – tap Accept on your personal job link,`,
    d.mode==="quote"?"":`or reply "YES ${j.ref}".`].filter(x=>x!=null).join("\n");
}
function contractorJobText(j){
  const p=j.property||{},d=D(j);
  const L=[`✅ JOB ${j.ref} IS YOURS – ${PLABEL[j.priority]||""}`,`${j.category||""}: ${j.description||""}`,"",`📍 ${[p.address,p.postcode].filter(Boolean).join(", ")}`];
  if(p.access)L.push(`Access: ${p.access}${p.keyInfo?" – "+p.keyInfo:""}`);
  if(p.accessNotes)L.push(p.accessNotes);
  if(p.parking)L.push(`Parking: ${p.parking}`);
  (j.residents||[]).forEach(r=>{if(r.name||r.phone)L.push(`Resident: ${r.name||""} ${r.phone||""}${r.notes?" ("+r.notes+")":""}`)});
  L.push(`Attend by: ${fmtDT(d.contractorAttendBy||j.attendBy)}`);
  if(d.agreedPrice)L.push(`Agreed price: ${gbp(d.agreedPrice)}`);
  const m=(j.materials||[]).filter(x=>x.item);if(m.length){L.push("","Materials:");m.forEach(x=>L.push(`• ${x.qty||1} × ${x.item} – ${x.supplier||""}`))}
  const lk=linkFor(S.contractors[d.allocatedTo]);if(lk)L.push("",`Update progress here: ${lk}`);
  return L.join("\n");
}

function viewDispatch(j){
  const d=D(j),ro=!S.canWrite;
  const ks=activeK();
  if(!ks.length)return `<p class="hint">No contractors saved yet. Add your maintenance people in the <button class="btn small" data-tab="contractors">Contractors</button> tab, then post jobs to them from here.</p>`;
  if(d.allocatedTo){
    const k=S.contractors[d.allocatedTo]||{};const t=j.track||{};const nx=nextStep(j);
    return `<div class="callout">
      <div class="row"><span class="pill d-allocated">Allocated</span><b>${esc(kName(d.allocatedTo))}</b><span class="mono">${esc(k.phone||"")}</span>
        <span class="hint">accepted ${fmtDT(d.allocatedAt)} via ${esc({app:"job board",whatsapp:"WhatsApp / phone",quote:"quote"}[d.acceptedVia]||d.acceptedVia||"—")}</span></div>
      <div class="g">
        <div><span class="hint">Agreed price</span><br><b class="num">${d.agreedPrice!==""&&d.agreedPrice!=null?gbp(d.agreedPrice):"—"}</b></div>
        <div><span class="hint">Contractor will attend</span><br><b>${fmtDT(d.contractorAttendBy)}</b></div>
        <div><span class="hint">Expected finish</span><br><b>${fmtDT(d.contractorFinishBy)}</b></div>
        <div><span class="hint">Your attend-by</span><br><b>${fmtDT(j.attendBy)}</b></div>
      </div>
      ${stepsHTML(j)}
      <div class="row">
        ${k.phone?`<a class="btn small wa" href="${esc(waLink(k.phone,contractorJobText(j)))}" target="_blank" rel="noopener">Send job details on WhatsApp</a>`:""}
        ${nx&&nx!=="signedoff"&&!ro?`<button class="btn small" data-act="o-step" data-step="${nx}">Mark “${TLABEL[nx]}” for them</button>`:""}
        ${t.done&&!t.signedoff&&!ro?`<button class="btn small go" data-act="o-step" data-step="signedoff">Sign off work</button>`:""}
        ${!t.done&&!ro?`<button class="btn small danger" data-act="o-reopen">Take back &amp; repost</button>`:""}
      </div></div>`;
  }
  if(d.status==="open"){
    const rec=(d.recipients||[]).map(id=>S.contractors[id]).filter(Boolean);
    const qs=Object.entries(j.quotes||{});
    return `<div class="callout">
      <div class="row"><span class="pill d-open">Posted ${fmtDT(d.postedAt)}</span><span>${d.mode==="quote"?"Asking for quotes":"Fixed fee "+gbp(d.fee)+" · first to accept gets it"}</span>
        <span class="hint">sent to ${rec.length} contractor${rec.length===1?"":"s"}</span></div>
      ${qs.length?`<div class="tablewrap"><table class="grid"><thead><tr><th>Contractor</th><th class="r">Price</th><th>Can attend</th><th>Finish by</th><th>Note</th><th></th></tr></thead><tbody>${qs.sort((a,b)=>n(a[1].price)-n(b[1].price)).map(([id,q])=>`<tr><td>${esc(kName(id))}</td><td class="r num"><b>${gbp(q.price)}</b></td><td>${fmtDT(q.attendBy)}</td><td>${fmtDT(q.finishBy)}</td><td>${esc(q.note||"")}</td><td><button class="btn small go" data-act="o-pick" data-k="${esc(id)}" ${ro?"disabled":""}>Allocate</button></td></tr>`).join("")}</tbody></table></div>`:(d.mode==="quote"?'<p class="hint">No quotes in yet. They appear here as contractors send them.</p>':'<p class="hint">Waiting for a contractor to accept on the job board.</p>')}

/* ---------- contractor payments (self-billing) ---------- */
const CIS=[["none","Not CIS / not construction work",0],["gross","CIS – gross payment status (0%)",0],["registered","CIS – registered (20%)",20],["unregistered","CIS – not registered (30%)",30]];
const CISLABEL=Object.fromEntries(CIS.map(x=>[x[0],x[1]]));
const cisRate=k=>{const x=CIS.find(c=>c[0]===(k&&k.cis||"none"));return x?x[2]:0};
function payCalc(p){
  const labour=n(p.labour),mats=n(p.materials),extras=(p.extras||[]).reduce((a,e)=>a+n(e.amount),0);
  const labourAll=labour+extras;
  const cis=Math.round(labourAll*n(p.cisRate))/100;
  const net=labourAll+mats;
  const vat=p.vatRegistered?Math.round(net*20)/100:0;
  const gross=net+vat;
  return {labour,mats,extras,labourAll,cis,net,vat,gross,pay:gross-cis};
}
function newPayout(j){
  const d=D(j),k=S.contractors[d.allocatedTo]||{};
  return {number:nextRef("SB-",x=>x.payout&&x.payout.number),issuedAt:new Date().toISOString().slice(0,10),
    labour:d.agreedPrice!==""&&d.agreedPrice!=null?n(d.agreedPrice):0,materials:0,extras:[],
    cisStatus:k.cis||"none",cisRate:cisRate(k),vatRegistered:!!k.vatRegistered,vatNumber:k.vatNumber||"",
    contractorId:d.allocatedTo,status:"owed",note:""};
}
function viewPayoutSection(j){

  return `<section class="sec"><div class="sec-h"><span class="n">12</span><h3>Contractor payment</h3>
    <div class="act"><span class="pill ${p.status==="paid"?"s-paid":"d-open"}">${esc(p.number)} · ${p.status==="paid"?"Paid":"Owed"}</span>
      <button class="btn small" data-act="p-dl">Download</button>
      ${k.phone?`<a class="btn small wa" href="${esc(waLink(k.phone,payoutText(j)))}" target="_blank" rel="noopener">Send on WhatsApp</a>`:""}
      ${p.status!=="paid"?`<button class="btn small go" data-act="p-paid" ${ro?"disabled":""}>Mark paid</button>`:""}</div></div>
    <p class="hint">Self-bill invoice from <b>${esc(kName(p.contractorId))}</b> to ${esc(S.settings.bizName||"you")} · ${esc(CISLABEL[p.cisStatus]||"")}${p.vatRegistered?" · VAT registered "+esc(p.vatNumber||""):""}. Changes save with <b>Save job</b>.</p>
    <div class="g">
      <label class="f"><span>Labour / agreed price £</span><input type="number" step="0.01" data-path="payout.labour" value="${esc(p.labour)}"></label>
      <label class="f"><span>Materials they paid for £</span><input type="number" step="0.01" data-path="payout.materials" value="${esc(p.materials)}"></label>
      <label class="f"><span>Self-bill date</span><input type="date" data-path="payout.issuedAt" value="${esc(p.issuedAt)}"></label>
      <label class="f"><span>CIS deduction %</span><select data-path="payout.cisRate">${opts([["0","0%"],["20","20%"],["30","30%"]],String(n(p.cisRate)))}</select></label>
    </div>
    ${ex?`<div class="tablewrap"><table class="lines"><thead><tr><th>Extra labour / work</th><th>Amount £</th><th></th></tr></thead><tbody>${ex}</tbody></table></div>`:""}
    <div class="row"><button class="btn small" data-act="p-addextra">+ Extra line</button>
      <label class="f" style="flex:1;min-width:200px"><span>Note on remittance</span><input data-path="payout.note" value="${esc(p.note)}" placeholder="e.g. Includes parking"></label></div>

/* ---------- actions ---------- */
async function write(path,data){
  if(!S.db){toast("Saving isn't available here");return false}
  try{await S.db.doc(path).set(data);return true}
  catch(e){return writeErr(e)}
}
function writeErr(e){toast((e&&e.message)||"Couldn't save – check your connection and try again");return false}
async function notify(path,body,what){
  try{const r=await S.db.api("POST",path,body||{});
    const res=r.results||r.sent||[];if(!res.length){toast(what+": nobody to message");return r}
    const bad=res.filter(x=>!x.ok);
    if(r.simulated)toast(`WhatsApp isn't connected yet – ${what} logged in Settings. Use the WhatsApp buttons for now.`);
    else toast(bad.length?`${what}: ${res.length-bad.length} sent, ${bad.length} failed (${bad[0].error||"error"})`:`${what}: sent to ${res.length} on WhatsApp`);
    return r}catch(e){toast(what+" failed: "+((e&&e.message)||"server error"))}
}
async function upd(id,obj){if(!S.db)return false;try{await S.db.doc("jobs/"+id).update(obj);return true}catch(e){return writeErr(e)}}
function selectJob(id){
  if(S.dirty&&S.sel&&S.sel!==id){toast("Save or discard changes first");return}
  S.sel=id;S.draft=clone(S.jobs[id]);S.dirty=false;S.touched=new Set();S.confirmDel=false;render();
  if(window.innerWidth<920)window.scrollTo(0,0);
}
function markDirty(key){S.dirty=true;if(key)S.touched.add(key.split(".")[0]);const sb=$("#savebar");if(sb){sb.classList.add("dirty");sb.querySelector(".note").textContent="Unsaved changes"}}
function logEntry(text){S.draft.log=(S.draft.log||[]).concat([{at:nowISO(),text}])}

async function saveJob(){
  const j=S.draft;j.updatedAt=nowISO();
  let out=clone(j);
  try{const cur=await S.db.doc("jobs/"+j.id).get();if(cur.exists)out=mergeServer(out,cur.data())}catch(e){}
  const ok=await write("jobs/"+j.id,out);
  if(ok){S.draft=clone(out);S.jobs[j.id]=clone(out);S.dirty=false;S.touched=new Set();toast(j.ref+" saved");render()}
  return ok;
}
async function officeUpdate(obj,logText){
  // write dispatch/tracking changes straight to the server, keep draft in step
  const j=S.draft;if(logText){logEntry(logText);obj.log=S.draft.log}
  if(await upd(j.id,obj)){
    const deep=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])){a[k]=a[k]&&typeof a[k]==="object"?a[k]:{};deep(a[k],b[k])}else a[k]=b[k]}};
    deep(S.draft,obj);if(S.jobs[j.id])deep(S.jobs[j.id],clone(obj));render();return true}
  return false;
}

document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-tab],[data-filter],[data-job],[data-act],[data-contact],[data-kontr],[data-openjob],[data-payk]");if(!t)return;
  if(t.dataset.payk){S.payFilter=t.dataset.payk;render();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;try{localStorage.setItem("jd-tab",S.tab)}catch(e){}render();return}
  if(t.dataset.filter){S.filter=t.dataset.filter;if(S.tab!=="jobs")S.tab="jobs";render();return}
  if(t.dataset.job&&!t.dataset.act){selectJob(t.dataset.job);return}
  if(t.dataset.openjob){S.tab="jobs";S.filter="all";selectJob(t.dataset.openjob);return}
  if(t.dataset.contact){S.cDraft=clone(S.contacts[t.dataset.contact]);render();return}
  if(t.dataset.kontr){S.kDraft=clone(S.contractors[t.dataset.kontr]);render();return}
  const a=t.dataset.act,j=S.draft;
  switch(a){
    case "close-copy":S.copyText=null;render();break;
    case "back":if(S.dirty){toast("Save or discard changes first");break}S.sel=null;S.draft=null;render();break;
    case "new-job":{
      if(S.dirty){toast("Save or discard changes first");break}
      const ref=S.db.collection("jobs").doc();const now=nowLocal();
      const job={id:ref.id,ref:nextRef("PM-",x=>x.ref),status:"new",priority:"routine",category:"",description:"",reportedAt:now,attendBy:addHours(now,168),
        property:{},residents:[{name:"",phone:""}],issuer:{},billSame:true,materials:[],labour:[{desc:"",hours:1,rate:S.settings.labourRate}],callout:S.settings.calloutDay,
        dispatch:{mode:"flat",sendTo:"all",fee:""},log:[{at:nowISO(),text:"Job logged"}],createdAt:nowISO()};
      S.jobs[job.id]=job;S.sel=job.id;S.draft=clone(job);S.dirty=true;S.touched=new Set();S.filter="open";render();
      const first=document.querySelector('[data-path="description"]');if(first)first.focus();break}
    case "save":saveJob();break;
    case "add-row":{const L=t.dataset.list;j[L]=j[L]||[];
      j[L].push(L==="materials"?{item:"",qty:1,unit:"",supplier:KPS.name,state:"need"}:L==="labour"?{desc:"",hours:1,rate:S.settings.labourRate}:{name:"",phone:""});
      markDirty(L);render();const rows=document.querySelectorAll(`[data-path^="${L}.${j[L].length-1}."]`);if(rows[0])rows[0].focus();break}
    case "del-row":j[t.dataset.list].splice(+t.dataset.i,1);markDirty(t.dataset.list);render();break;
    case "add-log":{const i=$("#lognote");if(!i.value.trim())break;logEntry(i.value.trim());markDirty("log");render();break}
    case "copy-sheet":copy(jobSheetText(j),"job text");break;
    case "copy-order":copy(kpsOrderText(j),"K's Plumbing Store order");break;
    case "copy-broadcast":copy(broadcastText(j),"WhatsApp group message");break;
    case "dl-sheet":saveFile(j.ref+" job sheet.html",jobSheetDoc(j));break;
    case "dl-invoice":saveFile((j.invoice.number||"invoice")+".html",invoiceDoc(j));break;
    case "copy-invmail":copy(invoiceEmail(j),"invoice email");break;
    case "issue":{
      const today=new Date().toISOString().slice(0,10);
      j.invoice={number:nextRef("INV-",x=>x.invoice&&x.invoice.number),issuedAt:today,dueAt:addDays(today,n(S.settings.payDays))};
      if(j.status!=="paid")j.status="invoiced";S.touched.add("status");if(!j.completedAt)j.completedAt=nowLocal();
      logEntry("Invoice "+j.invoice.number+" issued for "+gbp(calc(j).total));await saveJob();break}
    case "mark-paid":j.status="paid";S.touched.add("status");j.paidAt=new Date().toISOString().slice(0,10);logEntry("Marked paid");await saveJob();break;
    case "del-job":S.confirmDel=true;render();break;
    case "del-job-no":S.confirmDel=false;render();break;
    case "del-job-yes":{const id=j.id;try{await S.db.doc("jobs/"+id).delete()}catch(e){}delete S.jobs[id];S.sel=null;S.draft=null;S.dirty=false;S.confirmDel=false;toast("Job deleted");render();break}
    case "save-contact":{const src=j[t.dataset.from]||{};if(!src.name){toast("Add a name first");break}
      const ref=S.db.collection("contacts").doc();const c={id:ref.id,name:src.name||"",role:src.role||"",company:src.company||"",phone:src.phone||"",email:src.email||"",address:src.address||""};
      if(await write("contacts/"+c.id,c)){src.contactId=c.id;markDirty("issuer");toast("Contact saved");render()}break}

    /* dispatch – office */
    case "o-post":{
      const d=Object.assign({mode:"flat",sendTo:"all"},j.dispatch);
      if(d.mode==="flat"&&!n(d.fee)){toast("Enter the fee you'll pay");break}
      j.dispatch=d;const rec=recipientsFor(j);
      if(!rec.length){toast(d.sendTo==="pick"?"Tick at least one contractor":"No active contractors cover this trade – choose people instead");break}
      if(!j.description){toast("Describe the job first");break}
      if(!(j.property&&j.property.address)){toast("Add the property address first – the contractor gets it when they accept");break}
      const now=nowISO();
      j.dispatch=Object.assign(d,{status:"open",postedAt:now,recipients:rec,allocatedTo:"",agreedPrice:""});
      j.track={posted:now};j.quotes={};
      logEntry(`Posted to ${rec.length} contractor${rec.length>1?"s":""} – ${d.mode==="quote"?"quotes wanted":"fixed fee "+gbp(d.fee)}`);
      S.touched.add("dispatch");
      const ok=await (async()=>{const out=clone(j);out.updatedAt=now;if(await write("jobs/"+j.id,out)){S.jobs[j.id]=clone(out);S.dirty=false;S.touched=new Set();return true}return false})();
      if(ok){render();await notify(`/api/jobs/${j.id}/notify-post`,{},"Job alert");S.db.refresh()}break}
    case "o-resend":await notify(`/api/jobs/${j.id}/notify-post`,{},"Job alert");break;
    case "o-withdraw":await officeUpdate({dispatch:{status:"withdrawn"}},"Post withdrawn");break;
    case "o-pick":{const kid=t.dataset.k,q=(j.quotes||{})[kid]||{},now=nowISO();
      if(await officeUpdate({dispatch:{status:"allocated",allocatedTo:kid,allocatedAt:now,acceptedVia:"quote",agreedPrice:n(q.price),contractorAttendBy:q.attendBy||"",contractorFinishBy:q.finishBy||""},track:{accepted:now},status:"scheduled",scheduledAt:q.attendBy||j.scheduledAt||""},`Allocated to ${kName(kid)} at ${gbp(q.price)}`))
        await notify(`/api/jobs/${j.id}/notify-assigned`,{},"Contractor told");break}
    case "o-manual":{const kid=$("#manualK").value;if(!kid){toast("Choose the contractor who accepted");break}const pr=$("#manualPrice").value,now=nowISO();
      if(await officeUpdate({dispatch:{status:"allocated",allocatedTo:kid,allocatedAt:now,acceptedVia:"whatsapp",agreedPrice:pr===""?"":n(pr)},track:{accepted:now},status:"scheduled"},`Allocated to ${kName(kid)} (accepted by WhatsApp/phone)`))
        await notify(`/api/jobs/${j.id}/notify-assigned`,{},"Contractor told");break}
    case "o-step":{const st=t.dataset.step,now=nowISO();const o={track:{[st]:now}};if(T2STATUS[st])o.status=T2STATUS[st];if(st==="done"&&!j.completedAt)o.completedAt=nowLocal();if(st==="signedoff")o.status="complete";
      if(await officeUpdate(o,(st==="signedoff"?"Work signed off":"Marked “"+TLABEL[st]+"” for contractor"))&&["enroute","parts","done","signedoff"].includes(st))
        await notify(`/api/jobs/${j.id}/alert`,{event:st},"Customer update");break}
    case "o-alert":{const txt=$("#customAlert").value.trim();if(!txt){toast("Write the update first");break}
      if(S.dirty){toast("Save the job first so the right people get it");break}
      const r=await notify(`/api/jobs/${j.id}/alert`,{event:"custom",text:txt},"Update");if(r)$("#customAlert").value="";S.db.refresh();break}
    case "o-reopen":{const now=nowISO();await officeUpdate({dispatch:{status:"open",allocatedTo:"",agreedPrice:"",contractorAttendBy:"",contractorFinishBy:"",postedAt:now},track:{accepted:"",booked:"",enroute:"",onsite:"",parts:""},status:"new"},`Taken back from ${kName(D(j).allocatedTo)} and reposted`);break}

    /* contractors (office) */
    case "k-new":S.kDraft={id:S.db.collection("contractors").doc().id,token:newToken(),active:true,trades:[]};render();break;
    case "k-copylink":copy(linkFor(S.kDraft),"job link");break;

    /* contractor payments */
    case "p-create":{const k=S.contractors[D(j).allocatedTo]||{};j.payout=newPayout(j);logEntry(`Self-bill ${j.payout.number} created for ${kName(D(j).allocatedTo)}`);S.touched.add("payout");
      await saveJob();if(!k.selfBillAgreed)toast("Saved. Note: no self-billing agreement recorded for this contractor yet");break}
    case "p-addextra":j.payout.extras=(j.payout.extras||[]).concat([{desc:"",amount:""}]);markDirty("payout");render();break;
    case "p-delextra":j.payout.extras.splice(+t.dataset.i,1);markDirty("payout");render();break;
    case "p-paid":{const ref=($("#payref")||{}).value||"";j.payout.status="paid";j.payout.paidAt=new Date().toISOString().slice(0,10);j.payout.paidRef=ref.trim();
      logEntry(`Contractor paid ${gbp(payCalc(j.payout).pay)} (${j.payout.number})`);S.touched.add("payout");await saveJob();break}
    case "p-dl":saveFile(j.payout.number+" self-bill.html",payoutDoc(j));break;
    case "p-clearfilter":S.payFilter="";render();break;
    case "k-rotate":{try{const r=await S.db.api("POST",`/api/contractors/${S.kDraft.id}/rotate`);S.kDraft.token=r.token;if(S.contractors[S.kDraft.id])S.contractors[S.kDraft.id].token=r.token;toast("New link made – the old one no longer works");render()}catch(e){writeErr(e)}break}
    case "k-cancel":S.kDraft=null;render();break;
    case "k-save":{const d=S.kDraft;if(!d.name||!d.phone){toast("Add a name and mobile number");break}if(await write("contractors/"+d.id,d)){toast("Contractor saved");S.kDraft=null;render()}break}
    case "k-del":{try{await S.db.doc("contractors/"+S.kDraft.id).delete()}catch(e){}S.kDraft=null;toast("Contractor deleted");render();break}
    case "k-copyinvite":copy(inviteText(S.kDraft),"invite");break;

    case "c-new":S.cDraft={id:S.db.collection("contacts").doc().id};render();break;
    case "c-cancel":S.cDraft=null;render();break;
    case "c-save":{const d=S.cDraft;if(!d.name){toast("Add a name");break}if(await write("contacts/"+d.id,d)){toast("Contact saved");S.cDraft=null;render()}break}
    case "c-del":{try{await S.db.doc("contacts/"+S.cDraft.id).delete()}catch(e){}S.cDraft=null;toast("Contact deleted");render();break}
    case "s-save":{const ok=await write("settings/business",S.settings);if(ok)toast("Settings saved");break}
  }
});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"){const t=ev.target.closest("[data-job]");if(t&&!t.dataset.act)selectJob(t.dataset.job);if(ev.target.id==="lognote"){ev.preventDefault();document.querySelector('[data-act="add-log"]').click()}if(ev.target.id==="customAlert")document.querySelector('[data-act="o-alert"]').click()}});

function onField(ev){
  const el=ev.target;
  if(el.id==="q"){S.q=el.value;const pos=el.selectionStart;render();const q=$("#q");q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}return}
  if(el.dataset.cpath&&S.cDraft){S.cDraft[el.dataset.cpath]=el.value;return}
  if(el.dataset.kpath&&S.kDraft){S.kDraft[el.dataset.kpath]=el.type==="checkbox"?el.checked:el.value;if(el.type==="checkbox")render();return}
  if(el.dataset.ktrade&&S.kDraft){const s=new Set(S.kDraft.trades||[]);el.checked?s.add(el.dataset.ktrade):s.delete(el.dataset.ktrade);S.kDraft.trades=[...s];return}
  if(el.dataset.spath){const k=el.dataset.spath;S.settings[k]=el.type==="checkbox"?el.checked:(el.type==="number"?n(el.value):el.value);if(el.type==="checkbox")render();return}
  if(el.dataset.pick&&S.draft){const d=S.draft.dispatch=S.draft.dispatch||{};const s=new Set(d.picked||[]);el.checked?s.add(el.dataset.pick):s.delete(el.dataset.pick);d.picked=[...s];markDirty("dispatch");return}
  if(!el.dataset.path||!S.draft)return;
  const p=el.dataset.path,old=getPath(S.draft,p);
  setPath(S.draft,p,el.type==="checkbox"?el.checked:el.value);markDirty(p);
  if(p==="dispatch.mode"||p==="dispatch.sendTo"){render();return}
  if(p.startsWith("payout.")){const pt=$("#paytotals");if(pt)pt.innerHTML=payTotalsHTML(payCalc(S.draft.payout),S.draft.payout);return}
  if(p==="status"&&old!==el.value){logEntry("Status: "+(SLABEL[old]||old)+" → "+SLABEL[el.value]);if(el.value==="complete"&&!S.draft.completedAt)S.draft.completedAt=nowLocal();render();return}
  if(p==="priority"){const pr=PRIORITIES.find(x=>x[0]===el.value);S.draft.attendBy=addHours(S.draft.reportedAt||nowLocal(),pr[2]);
    if(el.value==="emergency"&&n(S.draft.callout)===n(S.settings.calloutDay))S.draft.callout=S.settings.calloutOOH;
    if(el.value!=="emergency"&&n(S.draft.callout)===n(S.settings.calloutOOH))S.draft.callout=S.settings.calloutDay;
    logEntry("Priority set to "+PLABEL[el.value]);render();return}
  if(p==="category"){render();return}
  if(/^(materials|labour)\.\d+\.(qty|unit|hours|rate)$/.test(p)||p==="callout"||p==="markup"){
    const row=el.closest("tr");if(row){const i=+p.split(".")[1];const L=p.split(".")[0];const x=S.draft[L][i];const cell=row.querySelector("td.r");if(cell)cell.textContent=gbp(L==="materials"?n(x.qty)*n(x.unit):n(x.hours)*n(x.rate))}
    const tt=$("#totals");if(tt)tt.innerHTML=totalsHTML(calc(S.draft));}
}
document.addEventListener("input",ev=>{if(ev.target.tagName!=="SELECT"&&ev.target.type!=="checkbox"&&ev.target.type!=="radio")onField(ev)});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="pickIssuer"||el.id==="pickBill"){const k=S.contacts[el.value];if(!k)return;const key=el.id==="pickIssuer"?"issuer":"bill";
    S.draft[key]=Object.assign({},S.draft[key],{contactId:k.id,name:k.name||"",role:k.role||"",company:k.company||"",phone:k.phone||"",email:k.email||"",address:k.address||""});markDirty(key);render();return}
  if(el.id==="billSame"){S.draft.billSame=el.checked;if(!el.checked&&!S.draft.bill)S.draft.bill={};markDirty("billSame");render();return}
  if(el.id==="manualK"||el.id==="manualPrice")return;
  if(el.tagName==="SELECT"||el.type==="checkbox"||el.type==="radio")onField(ev);
});
window.addEventListener("beforeunload",e=>{if(S.dirty){e.preventDefault();e.returnValue=""}});

/* ---------- server connection ---------- */
function makeDb(){
  let last=null,timer=null;const listeners=[];
  async function api(method,url,body){
    let r;try{r=await fetch(url,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,credentials:"same-origin"})}
    catch(e){S.offline=true;throw {message:"Can't reach the server"}}
    if(S.offline){S.offline=false}
    if(r.status===401){location.href="/login";throw {message:"Please log in again"}}
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw {message:j.error||("Server error "+r.status)};
    return j;
  }
  async function pull(force){
    try{
      if(!force&&last!==null){const v=(await api("GET","/api/version")).v;if(v===last)return}
      const all=await api("GET","/api/all");last=all.v;
      S.wa=all.wa;S.baseUrl=all.baseUrl;S.outbox=all.outbox||[];S.noDb=all.db===false&&location.hostname!=="localhost";
      listeners.forEach(fn=>fn(all));
    }catch(e){if(S.offline)render()}
  }
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  const docRef=(col,id)=>({id,
    async get(){const r=await api("GET",`/api/docs/${col}/${encodeURIComponent(id)}`);return {exists:r.exists,data:()=>r.data}},
    async set(d){await api("PUT",`/api/docs/${col}/${encodeURIComponent(id)}`,d);pull(true)},
    async update(d){await api("PATCH",`/api/docs/${col}/${encodeURIComponent(id)}`,d);pull(true)},
    async delete(){await api("DELETE",`/api/docs/${col}/${encodeURIComponent(id)}`);pull(true)}});
  return {api,on:fn=>listeners.push(fn),refresh:()=>pull(true),
    doc:p=>{const [c,i]=p.split("/");return docRef(c,i)},
    collection:col=>({doc:id=>docRef(col,id||rid())}),
    start(){pull(true);timer=setInterval(()=>{if(!document.hidden)pull(false)},6000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull(false)})}};
}
function editing(){const a=document.activeElement;return a&&a!==document.body&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")&&a.id!=="q"}
const byId=arr=>Object.fromEntries((arr||[]).map(d=>[d.id,d]));
S.db=makeDb();
S.db.on(all=>{
  S.contractors=byId(all.contractors);S.contacts=byId(all.contacts);
  const set=(all.settings||[]).find(d=>d.id==="business");if(set&&!(S.tab==="settings"&&editing()))S.settings=Object.assign({},DEF_SET,set);
  const m=byId(all.jobs);
  if(S.sel&&S.dirty&&!m[S.sel]&&S.jobs[S.sel])m[S.sel]=S.jobs[S.sel];
  S.jobs=m;S.loaded.jobs=true;
  if(S.sel){if(!S.dirty){if(m[S.sel])S.draft=clone(m[S.sel]);else{S.sel=null;S.draft=null}}else if(m[S.sel]&&S.draft)S.draft=mergeServer(S.draft,m[S.sel])}
  if(editing())return;
  render();
});
render();
S.db.start();
})();
</script>
