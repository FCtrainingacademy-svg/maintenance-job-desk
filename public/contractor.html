<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Job Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head><body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><h1 id="title">Job Board</h1><span id="sub"></span></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <div id="banner"></div>
  <main id="main"><div class="empty">Loading your jobs…</div></main>
</div>
<div id="toast" class="toast" hidden></div>
<script>
(function(){
"use strict";
const TOKEN=location.pathname.split("/").filter(Boolean)[1]||"";
const API="/api/c/"+encodeURIComponent(TOKEN);
const PLABEL={emergency:"Emergency (out of hours)",urgent:"Urgent – 24 hours",routine:"Routine – 7 days",planned:"Planned / quote"};
const TRACK=[["accepted","Accepted"],["booked","Booked in"],["enroute","On the way"],["onsite","On site"],["parts","Awaiting parts"],["done","Work complete"],["signedoff","Signed off"]];
const TLABEL=Object.fromEntries(TRACK);
const S={data:null,tab:"available",sel:null,seen:null,newCount:0,busy:false,error:null};
try{const t=localStorage.getItem("cb-tab");if(t)S.tab=t}catch(e){}
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gbp=v=>"£"+(Number(v)||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDT=iso=>{if(!iso)return"—";const d=new Date(iso);return isNaN(d)?esc(iso):d.toLocaleString("en-GB",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2800)}

async function api(method,path,body){
  const r=await fetch(API+path,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||"Something went wrong – try again");e.code=j.code;throw e}
  return j;
}
async function load(){
  try{
    S.data=await api("GET","");S.error=null;
    const ids=S.data.board.map(j=>j.id);
    if(S.seen){const fresh=ids.filter(id=>!S.seen.has(id));if(fresh.length&&!(S.tab==="available"&&!S.sel)){S.newCount+=fresh.length;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}}
    S.seen=new Set([...(S.seen||[]),...ids]);
  }catch(e){S.error=e.code==="badlink"?e.message:"Can't reach the job board right now. Check your signal – it will retry automatically."}
  if(!editing())render();
}
function editing(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")}
async function act(path,body,okMsg){
  if(S.busy)return;S.busy=true;render();
  try{await api("POST",path,body);toast(okMsg);await load();return true}
  catch(e){toast(e.message);return false}
  finally{S.busy=false;render()}
}

/* ---------- views ---------- */
const mineOpen=()=>(S.data?S.data.mine:[]).filter(j=>!j.track.done);
const mineDone=()=>(S.data?S.data.mine:[]).filter(j=>j.track.done);
function nextStep(t){for(const k of ["booked","enroute","onsite","done"])if(!t[k])return k;return null}
function render(){
  const d=S.data;
  if(S.error&&!d){$("#main").innerHTML=`<div class="panel join"><div class="panel-b"><p>${esc(S.error)}</p></div></div>`;$("#tabs").innerHTML="";return}
  if(!d)return;
  $("#title").textContent=d.office.name?d.office.name+" jobs":"Job Board";
  $("#sub").textContent=d.me.name+(d.me.company?" · "+d.me.company:"");
  const tabs=[["available","Available",d.board.length],["mine","My jobs",mineOpen().length],["done","Completed",0]];
  $("#tabs").innerHTML=tabs.map(([k,l,b])=>`<button class="tab" data-tab="${k}" aria-selected="${S.tab===k&&!S.sel}">${l}${b?`<span class="badge">${b}</span>`:""}</button>`).join("");
  let b="";
  if(S.error)b+=`<div class="banner">${esc(S.error)}</div>`;
  if(S.newCount)b+=`<div class="banner new"><b>${S.newCount} new job${S.newCount>1?"s":""} posted.</b> <button class="btn small" data-tab="available">View</button></div>`;
  $("#banner").innerHTML=b;
  document.title=(S.newCount?"("+S.newCount+") ":"")+"Job Board";
  const sel=S.sel&&d.mine.find(j=>j.id===S.sel);
  $("#main").innerHTML=sel?viewMine(sel):S.tab==="available"?viewBoard():viewList(S.tab==="done"?mineDone():mineOpen(),S.tab==="done");
}
function viewBoard(){
  const L=S.data.board;
  if(!L.length)return `<div class="board"><div class="panel"><div class="empty">No jobs waiting right now.<br>You'll get a WhatsApp message when one comes up, and it will appear here.</div></div></div>`;
  return `<div class="board">${L.map(j=>{const q=j.myQuote;return `<article class="jcard p-${esc(j.priority)}">
    <div class="top"><span class="mono">${esc(j.ref)}</span><span class="pill p-${esc(j.priority)}">${esc(PLABEL[j.priority]||"")}</span>${j.example?'<span class="example">example</span>':""}
      <span class="fee"${j.mode==="quote"?' style="font-size:16px"':""}>${j.mode==="quote"?"Quote wanted":gbp(j.fee)}</span></div>
    <h3>${esc(j.category||"Maintenance job")} · ${esc(j.area||"London")}</h3>
    <div>${esc(j.description||"")}</div>
    <div class="meta"><span>Attend by <b>${fmtDT(j.attendBy)}</b></span>${j.propertyType?`<span>${esc(j.propertyType)}</span>`:""}${j.respondBy?`<span>Quotes by <b>${fmtDT(j.respondBy)}</b></span>`:""}</div>
    ${j.mode==="quote"?`<div class="callout">${q?`<div class="hint">You quoted <b>${gbp(q.price)}</b>, attend ${fmtDT(q.attendBy)}. You can change it below.</div>`:""}
      <div class="g"><label class="f"><span>Your price £</span><input type="number" inputmode="decimal" step="0.01" min="0" id="qp-${esc(j.id)}" value="${esc(q&&q.price)}"></label>
      <label class="f"><span>Can attend</span><input type="datetime-local" id="qa-${esc(j.id)}" value="${esc(q&&q.attendBy)}"></label>
      <label class="f"><span>Finished by</span><input type="datetime-local" id="qf-${esc(j.id)}" value="${esc(q&&q.finishBy)}"></label></div>
      <label class="f"><span>Note (optional)</span><input id="qn-${esc(j.id)}" value="${esc(q&&q.note)}" placeholder="e.g. Includes parts, may need a second visit"></label>
      <div class="row"><button class="btn primary" data-act="quote" data-id="${esc(j.id)}" ${S.busy?"disabled":""}>${q?"Update quote":"Send quote"}</button></div></div>`
    :`<div class="row"><button class="btn go big" data-act="accept" data-id="${esc(j.id)}" ${S.busy?"disabled":""}>Accept job</button><span class="hint">Address and access details unlock once it's yours.</span></div>`}
  </article>`}).join("")}</div>`;
}
function viewList(L,done){
  if(!L.length)return `<div class="board"><div class="panel"><div class="empty">${done?"No completed jobs yet.":"No jobs yet. Accept one from Available."}</div></div></div>`;
  return `<div class="board">${L.map(j=>{const nx=nextStep(j.track);const p=j.property;return `<article class="jcard p-${esc(j.priority)}" data-open="${esc(j.id)}" style="cursor:pointer" tabindex="0">
    <div class="top"><span class="mono">${esc(j.ref)}</span><span class="pill p-${esc(j.priority)}">${esc(PLABEL[j.priority]||"")}</span><span class="fee" style="font-size:20px">${j.agreedPrice!==""&&j.agreedPrice!=null?gbp(j.agreedPrice):""}</span></div>
    <h3>${esc(p.address||"")}${p.postcode?", "+esc(p.postcode):""}</h3>
    <div class="meta"><span>${esc(j.category||"")}</span><span>Attend <b>${fmtDT(j.contractorAttendBy||j.attendBy)}</b></span><span>${done?(j.track.signedoff?"<b>Signed off</b>":"Awaiting sign-off"):"Next: <b>"+(nx?TLABEL[nx]:"—")+"</b>"}</span>${j.payment?`<span>${j.payment.status==="paid"?"Paid":"Owed"} <b>${gbp(j.payment.pay)}</b></span>`:""}</div></article>`}).join("")}</div>`;
}
function steps(t){
  const nx=nextStep(t);
  return `<ol class="steps">${TRACK.filter(([k])=>k!=="parts"||t.parts).map(([k,l])=>`<li class="${t[k]?"done":(k===nx?"next":"")}"><b>${l}</b><small>${t[k]?fmtDT(t[k]):(k===nx?"next":"")}</small></li>`).join("")}</ol>`;
}
function payBox(p){
  if(!p)return "";
  return `<section class="panel"><div class="panel-h"><h2>Payment</h2><span class="pill ${p.status==="paid"?"s-paid":"d-open"}">${p.status==="paid"?"Paid":"Owed"}</span></div><div class="panel-b">
    <div class="hint">Self-bill invoice ${esc(p.number)} · ${fmtD(p.issuedAt)}</div>
    <div class="totals"><span>Labour</span><span>${gbp(p.labour)}</span>${p.materials?`<span>Materials</span><span>${gbp(p.materials)}</span>`:""}${p.vat?`<span>VAT</span><span>${gbp(p.vat)}</span>`:""}
      <span>Invoice total</span><span>${gbp(p.gross)}</span>${p.cis?`<span class="m">CIS ${p.cisRate}%</span><span class="m">−${gbp(p.cis)}</span>`:""}
      <span class="big">${p.status==="paid"?"Paid to you":"To be paid"}</span><span class="big">${gbp(p.pay)}</span></div>
    ${p.status==="paid"?`<div class="hint">Paid ${fmtD(p.paidAt)}${p.paidRef?" · ref "+esc(p.paidRef):""}</div>`:""}
    ${p.note?`<div class="hint">${esc(p.note)}</div>`:""}</div></section>`;
}
const fmtD=iso=>{if(!iso)return"—";const d=new Date(iso);return isNaN(d)?esc(iso):d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})};
function viewMine(j){
  const p=j.property,t=j.track,nx=nextStep(t);
  const res=j.residents.map(r=>`<div><b>${esc(r.name)}</b> <a class="mono" href="tel:${esc(String(r.phone||"").replace(/\s/g,""))}">${esc(r.phone)}</a>${r.notes?` <span class="hint">${esc(r.notes)}</span>`:""}</div>`).join("");
  const mats=j.materials.map(m=>`<li>${esc(m.qty||1)} × ${esc(m.item)} <span class="hint">${esc(m.supplier||"")}</span></li>`).join("");
  const label={booked:"Confirm booking",enroute:"I'm on my way",onsite:"I'm on site"}[nx];
  const maps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([p.address,p.postcode].filter(Boolean).join(", "));
  return `<div class="board">
   <div><button class="btn small" data-act="back">← Back</button></div>
   <article class="jcard p-${esc(j.priority)}">
    <div class="top"><span class="mono">${esc(j.ref)}</span><span class="pill p-${esc(j.priority)}">${esc(PLABEL[j.priority]||"")}</span><span class="fee">${j.agreedPrice!==""&&j.agreedPrice!=null?gbp(j.agreedPrice):""}</span></div>
    <h3>${esc(p.address||"")}${p.postcode?", "+esc(p.postcode):""}</h3>
    <div class="row"><a class="btn small" href="${esc(maps)}" target="_blank" rel="noopener">Open in Maps</a></div>
    <div><b>${esc(j.category||"")}</b> – ${esc(j.description||"")}</div>
    <div class="meta">${p.access?`<span>Access <b>${esc(p.access)}</b>${p.keyInfo?" · "+esc(p.keyInfo):""}</span>`:""}${p.parking?`<span>Parking <b>${esc(p.parking)}</b></span>`:""}${p.stopcock?`<span>Stopcock <b>${esc(p.stopcock)}</b></span>`:""}</div>
    ${p.accessNotes?`<div class="hint">${esc(p.accessNotes)}</div>`:""}
    ${res?`<div class="callout"><span class="hint">RESIDENTS</span>${res}</div>`:""}
    ${mats?`<div><span class="hint">MATERIALS</span><ul style="margin:4px 0 0;padding-left:18px">${mats}</ul><div class="hint">Order from K's Plumbing Store on WhatsApp: 07488 287396</div></div>`:""}
    ${j.officePhone?`<div class="hint">Office: <a class="mono" href="tel:${esc(j.officePhone.replace(/\s/g,""))}">${esc(j.officePhone)}</a></div>`:""}
   </article>
   <section class="panel"><div class="panel-h"><h2>Progress</h2></div><div class="panel-b">
     ${steps(t)}
     <div class="row">${label?`<button class="btn go big" data-act="step" data-step="${nx}" data-id="${esc(j.id)}" ${S.busy?"disabled":""}>${label}</button>`:""}
     ${!t.done&&t.onsite&&!t.parts?`<button class="btn" data-act="step" data-step="parts" data-id="${esc(j.id)}">Waiting for parts</button>`:""}</div>
     ${nx==="booked"?'<p class="hint">Set your attend time below first.</p>':""}
   </div></section>
   <section class="panel"><div class="panel-h"><h2>Your timeframe</h2></div><div class="panel-b">
     <div class="g"><label class="f"><span>I'll attend</span><input type="datetime-local" id="ka" value="${esc(j.contractorAttendBy)}"></label>
     <label class="f"><span>Expect to finish</span><input type="datetime-local" id="kf" value="${esc(j.contractorFinishBy)}"></label></div>
     <div class="row"><button class="btn primary" data-act="time" data-id="${esc(j.id)}" ${S.busy?"disabled":""}>Save timeframe</button><span class="hint">Office needs you there by ${fmtDT(j.attendBy)}. The resident gets a WhatsApp with your time.</span></div>
   </div></section>
   ${!t.done&&t.onsite?`<section class="panel"><div class="panel-h"><h2>Finish the job</h2></div><div class="panel-b">
     <label class="f"><span>What did you do?</span><textarea id="kdone" placeholder="e.g. Replaced 15mm elbow under sink, tested, no leaks.">${esc(j.findings)}</textarea></label>
     <button class="btn go big" data-act="done" data-id="${esc(j.id)}" ${S.busy?"disabled":""}>Mark work complete</button></div></section>`:""}
   ${payBox(j.payment)}
   <section class="panel"><div class="panel-h"><h2>Notes to office</h2></div><div class="panel-b">
     <div class="row"><input id="knote" placeholder="e.g. Tenant not in, rebooking for 10am" style="flex:1;min-width:200px"><button class="btn" data-act="note" data-id="${esc(j.id)}">Send note</button></div>
     ${j.notes.length?`<ul class="log">${j.notes.map(n=>`<li><time>${fmtDT(n.at)}</time><span><span class="who">${esc(n.who)}:</span> ${esc(n.text)}</span></li>`).join("")}</ul>`:""}
     ${!t.done?(S.confirmBack===j.id?`<div class="row"><span>Hand this job back to the office?</span><button class="btn danger" data-act="handback-yes" data-id="${esc(j.id)}">Yes, hand back</button><button class="btn" data-act="handback-no">Keep it</button></div>`
       :`<button class="btn small danger" data-act="handback" style="justify-self:start">Can't do this job – hand it back</button>`):""}
   </div></section></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-tab],[data-act],[data-open]");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.sel=null;if(S.tab==="available")S.newCount=0;try{localStorage.setItem("cb-tab",S.tab)}catch(e){}render();window.scrollTo(0,0);return}
  if(t.dataset.open){S.sel=t.dataset.open;render();window.scrollTo(0,0);return}
  const id=t.dataset.id,v=x=>{const el=document.getElementById(x);return el?el.value.trim():""};
  switch(t.dataset.act){
    case "back":S.sel=null;render();break;
    case "accept":if(await act(`/jobs/${id}/accept`,{},"Job accepted – it's yours. Set your attend time.")){S.sel=id;S.tab="mine";render();window.scrollTo(0,0)}break;
    case "quote":await act(`/jobs/${id}/quote`,{price:v("qp-"+id),attendBy:v("qa-"+id),finishBy:v("qf-"+id),note:v("qn-"+id)},"Quote sent to the office");break;
    case "step":await act(`/jobs/${id}/step`,{step:t.dataset.step},(TLABEL[t.dataset.step]||"Updated")+" ✓");break;
    case "time":await act(`/jobs/${id}/time`,{attendBy:v("ka"),finishBy:v("kf")},"Timeframe saved");break;
    case "done":if(await act(`/jobs/${id}/done`,{text:v("kdone")},"Marked complete – the office will sign it off")){S.sel=null;S.tab="done";render()}break;
    case "note":if(await act(`/jobs/${id}/note`,{text:v("knote")},"Note sent")){}break;
    case "handback":S.confirmBack=S.sel;render();break;
    case "handback-no":S.confirmBack=null;render();break;
    case "handback-yes":if(await act(`/jobs/${id}/handback`,{},"Job handed back")){S.sel=null;S.confirmBack=null;S.tab="available";render()}break;
  }
});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"){const o=ev.target.closest("[data-open]");if(o){S.sel=o.dataset.open;render()}if(ev.target.id==="knote")document.querySelector('[data-act="note"]').click()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
load();
setInterval(()=>{if(!document.hidden)load()},15000);
})();
</script>
</body></html>
